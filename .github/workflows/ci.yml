name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate the example profiles
        run: npm run validate:examples
      - name: Example outputs are up to date
        run: |
          for ex in sample history; do
            for m in jsonresume schemaorg linkedin brief timeline; do
              ext=json; [ "$m" = linkedin ] && ext=txt
              node bin/profile.mjs convert "examples/$ex.profile.json" "$m" --on 2026-11-07 --out "examples/out/$ex.$m.$ext"
            done
          done
          git diff --exit-code -- examples/out ':!examples/out/imported-from-jsonresume.profile.json' ':!examples/out/employee.*'
