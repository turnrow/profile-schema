name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The résumé PDF tests render with Typst; without it they are skipped, so it is installed and pinned here.
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - run: npm test
      - name: Validate the example profiles
        run: npm run validate:examples
      - name: Example outputs are up to date
        run: |
          node scripts/make-fixtures.mjs
          for ex in sample history recommended; do
            src="examples/$ex.profile.json"; [ -d "examples/$ex" ] && src="examples/$ex"
            for m in jsonresume schemaorg linkedin brief timeline resume; do
              ext=json; [ "$m" = linkedin ] && ext=txt
              node bin/profile.mjs convert "$src" "$m" --on 2026-11-07 --out "examples/out/$ex.$m.$ext"
            done
          done
          node bin/profile.mjs review examples/sample.profile.json --on 2026-11-07 --out examples/out/sample.review.md
          git diff --exit-code -- examples/recommended examples/out ':!examples/out/imported-from-jsonresume.profile.json' ':!examples/out/employee.*'

  pdf:
    name: Résumé PDFs conform to PDF/UA-1
    runs-on: ubuntu-latest
    env:
      # Pinned by version and by digest, so the validator can't change under a green build.
      VERAPDF_IMAGE: verapdf/cli:v1.30.3@sha256:d74b7026c18a0f171e73c153b617fe6520e1511feb24ca98a348b2bb897669fb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Render every example PDF
        run: node scripts/render-example-pdfs.mjs pdf-out
      - name: Validate with veraPDF (PDF/UA-1)
        run: |
          count=$(ls pdf-out/*.pdf | wc -l)
          # veraPDF's exit code is not documented, so the report decides; "|| true" keeps a non-zero exit from hiding it.
          docker run --rm -v "$PWD/pdf-out:/data:ro" "$VERAPDF_IMAGE" -f ua1 /data > verapdf-report.xml || true
          node scripts/check-pdfua.mjs verapdf-report.xml --expect "$count"
      - name: Keep the PDFs and the report for the manual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            pdf-out/
            verapdf-report.xml
          if-no-files-found: warn
