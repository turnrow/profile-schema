name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The résumé PDF tests render with Typst; without it they are skipped, so it is installed and pinned here.
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      # The Open Badges 3.0 and CLR 2.0 outputs are validated against 1EdTech's schemas; without them those tests are skipped.
      - name: Keep fetched standards between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: standards-${{ hashFiles('scripts/fetch-*.mjs') }}
      - name: Fetch the 1EdTech JSON Schemas
        run: node scripts/fetch-1edtech-schemas.mjs
      # The HR Open Candidate is validated against HR Open's release, a 30 MB archive, so it is cached above.
      - name: Fetch the HR Open Standards release
        run: node scripts/fetch-hropen-schemas.mjs
      - run: npm test
      - name: Validate the example profiles
        run: npm run validate:examples
      - name: Example outputs are up to date
        run: |
          node scripts/make-fixtures.mjs
          for ex in sample history recommended; do
            src="examples/$ex.profile.json"; [ -d "examples/$ex" ] && src="examples/$ex"
            for m in jsonresume schemaorg linkedin brief timeline resume hropen; do
              ext=json; [ "$m" = linkedin ] && ext=txt
              node bin/profile.mjs convert "$src" "$m" --on 2026-11-07 --out "examples/out/$ex.$m.$ext"
            done
            node bin/profile.mjs convert "$src" gedcom7 --on 2026-11-07 --out "examples/out/$ex.ged"
            node bin/profile.mjs convert "$src" gedcom551 --on 2026-11-07 --out "examples/out/$ex.551.ged"
            node bin/profile.mjs convert "$src" ats --on 2026-11-07 --out "examples/out/$ex.ats.txt"
            node bin/profile.mjs convert "$src" europass --on 2026-11-07 --out "examples/out/$ex.europass.xml"
          done
          for m in ob3 clr; do
            node bin/profile.mjs convert examples/recommended "$m" --on 2026-11-07 --out "examples/out/recommended.$m.json"
          done
          node bin/profile.mjs review examples/sample.profile.json --on 2026-11-07 --out examples/out/sample.review.md
          node scripts/make-directory-example.mjs
          rm -rf examples/out/directory
          node bin/profile.mjs directory diff examples/directory/people --against examples/directory/acme-users.scim.json --target scim --domain acme.example --method oidc --on 2026-11-07 --out examples/out/directory
          rm -rf examples/out/directory-google-csv examples/out/directory-ldif
          node bin/profile.mjs directory diff examples/directory/people --against examples/directory/acme-users.google.csv --target google-csv --domain acme.example --method oidc --on 2026-11-07 --out examples/out/directory-google-csv
          node bin/profile.mjs directory diff examples/directory/people --against examples/directory/acme-users.ldif --target ldif --domain acme.example --method oidc --on 2026-11-07 --out examples/out/directory-ldif
          node scripts/make-orgchart-example.mjs
          node bin/profile.mjs orgchart validate examples/orgchart/acme.org.json
          node bin/profile.mjs orgchart show examples/orgchart/acme.org.json --on 2026-11-07 --compare 2026-01-05 --out examples/out/orgchart/acme.md
          node bin/profile.mjs orgchart show examples/orgchart/acme.org.json --on 2026-11-07 --format csv --out examples/out/orgchart/acme.csv
          node bin/profile.mjs orgchart show examples/orgchart/acme.org.json --on 2026-11-07 --compare 2026-01-05 --format html --out examples/out/orgchart/acme.html
          node bin/profile.mjs orgchart stats examples/orgchart/acme.org.json --on 2026-11-07 --from 2026-01-05 --to 2026-11-07 --out examples/out/orgchart/acme.stats.md
          git diff --exit-code -- examples/recommended examples/directory examples/orgchart examples/out ':!examples/out/imported-from-jsonresume.profile.json' ':!examples/out/employee.*'

  pdf:
    name: Résumé PDFs conform to PDF/UA-1
    runs-on: ubuntu-latest
    env:
      # Pinned by version and by digest, so the validator can't change under a green build.
      VERAPDF_IMAGE: verapdf/cli:v1.30.3@sha256:d74b7026c18a0f171e73c153b617fe6520e1511feb24ca98a348b2bb897669fb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - name: Render every example PDF
        run: node scripts/render-example-pdfs.mjs pdf-out
      - name: Validate with veraPDF (PDF/UA-1)
        run: |
          count=$(ls pdf-out/*.pdf | wc -l)
          # veraPDF's exit code is not documented, so the report decides; "|| true" keeps a non-zero exit from hiding it.
          docker run --rm -v "$PWD/pdf-out:/data:ro" "$VERAPDF_IMAGE" -f ua1 /data > verapdf-report.xml || true
          node scripts/check-pdfua.mjs verapdf-report.xml --expect "$count"
      - name: The text of each PDF is in reading order
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          node scripts/check-reading-order.mjs pdf-out
      - name: Keep the PDFs and the report for the manual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            pdf-out/
            verapdf-report.xml
          if-no-files-found: warn
