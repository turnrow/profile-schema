name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate the example profiles
        run: npm run validate:examples
      - name: Example outputs are up to date
        run: |
          node scripts/make-fixtures.mjs
          for ex in sample history recommended; do
            src="examples/$ex.profile.json"; [ -d "examples/$ex" ] && src="examples/$ex"
            for m in jsonresume schemaorg linkedin brief timeline resume; do
              ext=json; [ "$m" = linkedin ] && ext=txt
              node bin/profile.mjs convert "$src" "$m" --on 2026-11-07 --out "examples/out/$ex.$m.$ext"
            done
          done
          node bin/profile.mjs review examples/sample.profile.json --on 2026-11-07 --out examples/out/sample.review.md
          git diff --exit-code -- examples/recommended examples/out ':!examples/out/imported-from-jsonresume.profile.json' ':!examples/out/employee.*'
