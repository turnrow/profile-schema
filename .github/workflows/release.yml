name: Release

# Tags and publishes a GitHub release for the version in package.json, once, when it reaches main.
# To release: bump "version" in package.json, add a "## <version> (<date>): …" entry to CHANGELOG.md,
# and merge. Nothing happens when the tag already exists.
# It also backfills: any version with a CHANGELOG entry but no tag is tagged at the commit on main
# where package.json first reached it (scripts/missing-releases.mjs), and published as a release
# that is not marked latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Backfill releases for earlier versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/missing-releases.mjs | while read -r v sha; do
            [ "$v" = "$(node -p "require('./package.json').version")" ] && continue
            awk -v v="$v" '
              /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "notes-$v.md"
            echo "Backfilling v$v at $sha"
            gh release create "v$v" --target "$sha" --title "Profile Schema $v" --notes-file "notes-$v.md" --latest=false
          done
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test before releasing
        if: steps.version.outputs.needed == 'true'
        run: |
          npm ci
          npm test
          npm run validate:examples
      - name: Release notes from the changelog
        if: steps.version.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION; add one before releasing."
            exit 1
          fi
      - name: Tag and publish
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Profile Schema $VERSION" --notes-file release-notes.md
