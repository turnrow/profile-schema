<!-- profile-schema: paste into <head>. Paths assume the brand/ folder is served at /brand/. -->
<link rel="icon" href="/brand/ico/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/brand/svg/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/png/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#04161d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/brand/design-system/tokens.css">

<!-- Lockup that swaps with the colour scheme -->
<picture>
  <source srcset="/brand/svg/profile-schema-lockup-dark.svg" media="(prefers-color-scheme: dark)">
  <img src="/brand/svg/profile-schema-lockup-light.svg" alt="Profile Schema" height="40">
</picture>
